spring:
  datasource:
    url: jdbc:h2:file:./data/resource_booking;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: local-dev-jwt-secret-key-must-be-32-bytes
    expiration-ms: 86400000
