server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resource-booking-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/resource_booking}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-32-byte-minimum-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
