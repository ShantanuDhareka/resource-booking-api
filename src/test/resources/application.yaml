spring:
  datasource:
    url: jdbc:h2:mem:resource_booking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

app:
  jwt:
    secret: test-jwt-secret-key-must-be-32-bytes-min
    expiration-ms: 3600000
